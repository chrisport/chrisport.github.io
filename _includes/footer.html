<footer class="site-footer">

    <div class="wrapper">
        {% for member in site.data.members %}
        {% if member.stackoverflow_username %}
        <span class="social-media-logo">
            <a rel="noopener noreferrer" href="https://stackoverflow.com/users/3210551/chrisport" target="_blank">
                <i class="fa-brands fa-stack-overflow fa-2x"></i>
            </a>
          </span>
        {% endif %}
        {% if member.linkedin_username %}
        <span class="social-media-logo">
              <a rel="noopener noreferrer"  href="https://linkedin.com/in/{{ member.linkedin_username }}" target="_blank">
                  <i class="fa-brands fa-linkedin fa-2x"></i>
              </a>
          </span>
        {% endif %}
        {% if member.github_username %}
        <span class="social-media-logo">
              <a rel="noopener noreferrer"  href="https://github.com/{{ member.github_username }}" target="_blank">
                  <i class="fa-brands fa-github fa-2x"></i>
              </a>
          </span>
        {% endif %}


        {% endfor %}

    </div>
</footer>
